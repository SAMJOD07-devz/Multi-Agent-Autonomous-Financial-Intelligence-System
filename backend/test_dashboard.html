<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Agent Financial Intelligence System - Developer Test Console</title>
  <style>
    :root {
      --bg-dark: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --accent-orange: #d29922;
      --accent-red: #f85149;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    h1 {
      color: var(--accent-blue);
      margin: 0 0 8px 0;
    }
    p.subtitle {
      color: var(--text-muted);
      margin: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--text-main);
    }
    input, select {
      width: 100%;
      padding: 10px;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-primary {
      background-color: #238636;
      color: #fff;
    }
    .btn-primary:hover { background-color: #2ea043; }
    .btn-ws {
      background-color: #1f6feb;
      color: #fff;
    }
    .btn-ws:hover { background-color: #388bfd; }
    pre {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
      color: #7ee787;
      max-height: 400px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }
    .badge-success { background: rgba(63,185,80,0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .badge-degraded { background: rgba(248,81,73,0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🤖 Autonomous Financial Intelligence System</h1>
      <p class="subtitle">Interactive Local Backend QA & Test Console (REST & WebSockets)</p>
    </header>

    <div class="grid">
      <div class="card">
        <h3>1. Request Parameters</h3>
        <div class="form-group">
          <label for="ticker">Stock Ticker Symbol</label>
          <input type="text" id="ticker" value="RELIANCE" placeholder="e.g. RELIANCE, TCS, INFY">
        </div>

        <div class="form-group">
          <label for="profile">Behavioral Risk Profile</label>
          <select id="profile">
            <option value="Conservative">Conservative (Capital Preservation Focus)</option>
            <option value="Aggressive">Aggressive (Growth & Momentum Focus)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="scenario">Simulation Scenario (QA Testing)</label>
          <select id="scenario">
            <option value="">Normal Execution (Clean Pipeline)</option>
            <option value="timeout">Live Market Feed Timeout (Degraded)</option>
            <option value="missing_filing">Missing Regulatory Disclosure (Degraded)</option>
            <option value="conflicting">Conflicting Signals (BULLISH vs BEARISH)</option>
            <option value="uncited">Uncited Output (Zero-Uncited Safety Enforcement)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="user_id">User ID (Optional)</label>
          <input type="text" id="user_id" value="user_cons_01">
        </div>

        <div class="btn-group">
          <button class="btn-primary" onclick="runRESTAnalysis()">Run REST Analysis</button>
          <button class="btn-ws" onclick="streamWebSocketTrace()">Stream WS Trace</button>
        </div>
      </div>

      <div class="card">
        <h3>2. Output & Trace Feed</h3>
        <div id="statusBadge" style="margin-bottom: 10px;">
          <span class="badge badge-success">READY</span>
        </div>

        <div id="outputContainer">
          <pre id="jsonOutput">// Click 'Run REST Analysis' or 'Stream WS Trace' to test</pre>
        </div>
      </div>
    </div>
  </div>

  <script>
    const baseUrl = "http://localhost:8000";

    async function runRESTAnalysis() {
      const ticker = document.getElementById("ticker").value;
      const profile = document.getElementById("profile").value;
      const scenario = document.getElementById("scenario").value;
      const user_id = document.getElementById("user_id").value;

      document.getElementById("statusBadge").innerHTML = `<span class="badge" style="background: rgba(210,153,34,0.2); color: var(--accent-orange);">RUNNING ANALYSIS...</span>`;
      document.getElementById("jsonOutput").innerText = "Sending POST /api/v1/analyze request...";

      let url = `${baseUrl}/api/v1/analyze`;
      if (scenario) {
        url += `?scenario=${scenario}`;
      }

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ticker: ticker,
            behavioral_profile: profile,
            user_id: user_id
          })
        });

        const data = await res.json();
        
        if (data.degraded_state) {
          document.getElementById("statusBadge").innerHTML = `<span class="badge badge-degraded">DEGRADED STATE (SAFETY ENFORCED)</span>`;
        } else {
          document.getElementById("statusBadge").innerHTML = `<span class="badge badge-success">SUCCESS - REC: ${data.recommendation ? data.recommendation.label : 'N/A'}</span>`;
        }

        document.getElementById("jsonOutput").innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById("statusBadge").innerHTML = `<span class="badge badge-degraded">ERROR / SERVER OFF</span>`;
        document.getElementById("jsonOutput").innerText = `Failed to connect to backend server. Make sure Uvicorn is running on http://localhost:8000.\n\nError: ${err.message}`;
      }
    }

    function streamWebSocketTrace() {
      const ticker = document.getElementById("ticker").value;
      const profile = document.getElementById("profile").value;
      const scenario = document.getElementById("scenario").value;

      document.getElementById("statusBadge").innerHTML = `<span class="badge" style="background: rgba(88,166,255,0.2); color: var(--accent-blue);">WS CONNECTING...</span>`;
      const outputElem = document.getElementById("jsonOutput");
      outputElem.innerText = "Connecting to ws://localhost:8000/ws/agent-trace...\n";

      try {
        const ws = new WebSocket("ws://localhost:8000/ws/agent-trace");

        ws.onopen = () => {
          document.getElementById("statusBadge").innerHTML = `<span class="badge badge-success">WS CONNECTED</span>`;
          ws.send(JSON.stringify({
            ticker: ticker,
            behavioral_profile: profile,
            scenario: scenario
          }));
        };

        ws.onmessage = (event) => {
          const evtData = JSON.parse(event.data);
          outputElem.innerText += `\n[Seq #${evtData.sequence_number}] ${evtData.event_type.toUpperCase()}: ${JSON.stringify(evtData.payload)}`;
          outputElem.scrollTop = outputElem.scrollHeight;
        };

        ws.onclose = () => {
          outputElem.innerText += "\n\n[WebSocket Stream Closed Cleanly]";
        };

        ws.onerror = (err) => {
          document.getElementById("statusBadge").innerHTML = `<span class="badge badge-degraded">WS ERROR</span>`;
          outputElem.innerText += `\n[WebSocket Error] ${err}`;
        };
      } catch (e) {
        outputElem.innerText = `WebSocket Exception: ${e.message}`;
      }
    }
  </script>
</body>
</html>
